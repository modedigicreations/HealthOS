services:
  postgres:
    image: postgres:17-alpine
    container_name: healthos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthos
      POSTGRES_PASSWORD: healthos_dev_password
      POSTGRES_DB: healthos
    ports:
      - "5432:5432"
    volumes:
      - healthos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthos -d healthos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - healthos_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: healthos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: healthos_minio
      MINIO_ROOT_PASSWORD: healthos_minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - healthos_miniodata:/data

volumes:
  healthos_pgdata:
  healthos_redisdata:
  healthos_miniodata:
